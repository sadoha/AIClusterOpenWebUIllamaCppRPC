# Official Docker Compose Specification: https://docs.docker.com/compose/compose-file/
x-llama-build-common: &llama-build-common
  context: https://github.com/ggml-org/llama.cpp.git#${LLAMA_CPP_REF:-ddd4ec1428a6201e18975ea52b07c71e0f9aef26}
  dockerfile_inline: |
    ARG LLAMA_RUNTIME_PACKAGES
    ARG LLAMA_ENTRYPOINT
    FROM ubuntu:24.04 AS builder
    RUN apt-get update && apt-get install -y --no-install-recommends cmake g++ make git
    COPY . /app
    WORKDIR /app
    # Compile with RPC enabled and isolate output via CMAKE_INSTALL_PREFIX
    RUN cmake -B build -DGGML_RPC=ON -DCMAKE_INSTALL_PREFIX=/out
    RUN cmake --build build --config Release --target install

    FROM ubuntu:24.04
    ARG LLAMA_RUNTIME_PACKAGES
    ARG LLAMA_ENTRYPOINT
    RUN apt-get update && apt-get install -y $${LLAMA_RUNTIME_PACKAGES} && rm -rf /var/lib/apt/lists/*
    COPY --from=builder /out /usr/local
    RUN ldconfig
    ENV LLAMA_ENTRYPOINT=$${LLAMA_ENTRYPOINT}
    ENTRYPOINT ["/bin/sh", "-c", "exec \"$$LLAMA_ENTRYPOINT\" \"$$@\"", "--"]

x-llama-rpc-worker-build: &llama-rpc-worker-build
  <<: *llama-build-common
  args:
    LLAMA_RUNTIME_PACKAGES: libgomp1
    LLAMA_ENTRYPOINT: ggml-rpc-server

x-llama-server-head-build: &llama-server-head-build
  <<: *llama-build-common
  args:
    LLAMA_RUNTIME_PACKAGES: libgomp1 curl
    LLAMA_ENTRYPOINT: llama-server

services:
  # ---------------------------------------------------------
  # INIT SERVICE: Automated Model Downloader
  # ---------------------------------------------------------
  model-downloader:
    image: alpine:${ALPINE_VERSION:-3.22}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: model-downloader
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - model-data:/models
    command: >
      /bin/sh -c "
      apk add --no-cache curl &&
      if [ ! -f /models/gemma-3-1b-it-Q4_K_M.gguf ]; then
        echo 'Downloading Gemma 3 1B IT GGUF...' &&
        curl -f -L -H \"Authorization: Bearer $${HF_TOKEN}\" -o /models/gemma-3-1b-it-Q4_K_M.gguf https://huggingface.co/ggml-org/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf;
      else
        echo 'Gemma 3 1B model file already exists. Skipping download.';
      fi
      "
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------
  # WORKER NODE 1: Custom Compiled llama.cpp RPC Server
  # Official RPC Docs: https://github.com/ggml-org/llama.cpp/blob/master/tools/rpc/README.md
  # ---------------------------------------------------------
  llama-rpc-worker-1:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build: *llama-rpc-worker-build
    container_name: llama-rpc-worker-1
    restart: unless-stopped
    networks:
      - ai-internal-net
    command: >
      --host 0.0.0.0
      --port 50052
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------
  # WORKER NODE 2: Custom Compiled llama.cpp RPC Server
  # ---------------------------------------------------------
  llama-rpc-worker-2:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build: *llama-rpc-worker-build
    container_name: llama-rpc-worker-2
    restart: unless-stopped
    networks:
      - ai-internal-net
    command: >
      --host 0.0.0.0
      --port 50052
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------
  # HEAD NODE: Custom Compiled llama.cpp HTTP Server
  # ---------------------------------------------------------
  llama-server-head:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build: *llama-server-head-build
    container_name: llama-server-head
    restart: unless-stopped
    networks:
      - ai-internal-net
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - model-data:/models:ro
    depends_on:
      model-downloader:
        condition: service_completed_successfully
      llama-rpc-worker-1:
        condition: service_started
      llama-rpc-worker-2:
        condition: service_started
    command: >
      -m /models/gemma-3-1b-it-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --jinja
      -c ${LLAMA_CTX_SIZE:-65536}
      -t ${LLAMA_THREADS:-4}
      --rpc llama-rpc-worker-1:50052,llama-rpc-worker-2:50052
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------
  # FRONTEND SERVICE: Open WebUI
  # Official Open WebUI Docs: https://docs.openwebui.com/
  # Official Docker Open WebUI Integration: https://docs.docker.com/ai/model-runner/openwebui-integration/
  # ---------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.11.0}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai-internal-net
    ports:
      # Expose the web interface port to host
      - "127.0.0.1:3000:8080"
    environment:
      # Connects Open WebUI to the internal llama.cpp head node API
      - OPENAI_API_BASE_URL=http://llama-server-head:8080/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_AUTH=true
    volumes:
      # Managed volume for user data, settings, and chat history storage
      - open-webui-data:/app/backend/data
    depends_on:
      llama-server-head:
        # Prevents Open WebUI from starting until the head node passes its healthcheck
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------
  # INIT SERVICE: Hermes custom endpoint bootstrap for llama.cpp
  # Official Hermes Docker Docs: https://hermes-agent.nousresearch.com/docs/user-guide/docker
  # Official Hermes Providers Docs: https://hermes-agent.nousresearch.com/docs/integrations/providers
  # ---------------------------------------------------------
  hermes-bootstrap:
    image: nousresearch/hermes-agent:${HERMES_AGENT_VERSION:-v2026.7.30}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: hermes-bootstrap
    networks:
      - ai-internal-net
    volumes:
      - hermes-data:/opt/data
    depends_on:
      llama-server-head:
        condition: service_healthy
    command: >
      /bin/sh -c "
      set -eu;
      hermes config set model.provider custom;
      hermes config set model.base_url http://llama-server-head:8080/v1;
      hermes config set model.default $${HERMES_MODEL_ID};
      hermes config set model.context_length $${HERMES_CONTEXT_LENGTH};
      hermes config set model.api_key $${HERMES_MODEL_API_KEY};
      hermes config set API_SERVER_ENABLED false;
      hermes config set API_SERVER_HOST 127.0.0.1;
      hermes config set GATEWAY_ALLOW_ALL_USERS $${GATEWAY_ALLOW_ALL_USERS};
      hermes config set TELEGRAM_ALLOWED_USERS $${TELEGRAM_ALLOWED_USERS};
      hermes config set tool_loop_guardrails.hard_stop_enabled true;
      "
    environment:
      - HERMES_MODEL_ID=${HERMES_MODEL_ID:-gemma-3-1b-it-Q4_K_M}
      - HERMES_CONTEXT_LENGTH=${HERMES_CONTEXT_LENGTH:-65536}
      - HERMES_MODEL_API_KEY=${HERMES_MODEL_API_KEY:-none}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-0}
    # The official Hermes container uses s6 overlay and must be able to
    # manage uid/gid transitions during init.

  # ---------------------------------------------------------
  # AGENT SERVICE: Hermes Agent Gateway
  # Official Hermes Quickstart: https://hermes-agent.nousresearch.com/docs/getting-started/quickstart
  # ---------------------------------------------------------
  hermes-agent:
    image: nousresearch/hermes-agent:${HERMES_AGENT_VERSION:-v2026.7.30}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: hermes-agent
    restart: unless-stopped
    networks:
      - ai-internal-net
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    environment:
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-false}
      - API_SERVER_HOST=${API_SERVER_HOST:-127.0.0.1}
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-0}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    volumes:
      - hermes-data:/opt/data
    depends_on:
      hermes-bootstrap:
        condition: service_completed_successfully
    # The official Hermes container uses s6 overlay and must be able to
    # manage uid/gid transitions during init.

# ---------------------------------------------------------
# ISOLATED NETWORKS & PERSISTENT VOLUMES
# Official Docker Networking Docs: https://docs.docker.com/engine/network/
# Official Docker Volumes Docs: https://docs.docker.com/engine/storage/volumes/
# ---------------------------------------------------------
networks:
  ai-internal-net:
    driver: bridge

volumes:
  model-data:
    driver: local
  open-webui-data:
    driver: local
  hermes-data:
    driver: local
